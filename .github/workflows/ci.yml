name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate DI/build_runner output
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization output
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test

      - name: Install design_system dependencies
        working-directory: packages/design_system
        run: flutter pub get

      - name: Analyze design_system
        working-directory: packages/design_system
        run: flutter analyze
        continue-on-error: true

      - name: Test design_system
        working-directory: packages/design_system
        run: flutter test

      - name: Install navigation dependencies
        working-directory: packages/navigation
        run: flutter pub get

      - name: Analyze navigation
        working-directory: packages/navigation
        run: flutter analyze
        continue-on-error: true

      - name: Test navigation
        working-directory: packages/navigation
        run: flutter test
