name: CI

# TESTING STRATEGY (3-Tier)
#
# TODO
# Tier 1: Unit + Widget Tests
#   - Runs: Every push/PR
#   - Scope: BLoC logic, widget rendering, UI responsiveness (breakpoints)
#   - Speed: Fast (<1 min)
#   - Purpose: Core business functionality, layout behavior
#
# Tier 2: Integration Tests
#   - Runs: Conditional (on code changes to tested features)
#   - Scope: Important user journeys (list->detail->edit->delete flows)
#   - Speed: Moderate (2-3 min)
#   - Purpose: Cross-component behavior, platform-specific flows
#   - Status: Future - add when >10 integration tests exist
#
# Tier 3: Performance + E2E
#   - Runs: Manual / Scheduled
#   - Scope: Scroll FPS, device-specific testing, visual regression
#   - Speed: Slow (5-10 min)
#   - Purpose: Performance, hardware-specific edge cases
#   - Status: Excluded for now (solo project, high cost)
#
# Rationale: Core business functionality tested in code as much as possible.
# UI responsiveness (breakpoint layout) -> Tier 1. Performance/E2E -> Tier 3.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # The root analysis also reads every package, so all of them must resolve first.
      - name: Install dependencies
        run: |
          for pubspec in $(git ls-files '*pubspec.yaml'); do
            (cd "$(dirname "$pubspec")" && flutter pub get)
          done

      # Pinned to the version in pubspec.lock.
      - name: Install very_good_cli
        run: |
          dart pub global activate very_good_cli 1.3.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate DI/build_runner output
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization output
        run: flutter gen-l10n

      - name: Validate agent context, skills, and ADRs
        run: |
          dart run tool/agent_context/validate.dart
          dart run tool/skills/validate.dart
          dart run tool/decisions/adr.dart check

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-pub

      - name: Bloc lint
        run: tool/hooks/bloc_lint.sh lib test packages

      - name: Test
        run: very_good test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Test design_system
        working-directory: packages/design_system
        run: very_good test

      - name: Test navigation
        working-directory: packages/navigation
        run: very_good test
