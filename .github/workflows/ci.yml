name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install very_good_cli
        run: |
          dart pub global activate very_good_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate DI/build_runner output
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization output
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Test
        run: very_good test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Install design_system dependencies
        working-directory: packages/design_system
        run: flutter pub get

      - name: Analyze design_system
        working-directory: packages/design_system
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Test design_system
        working-directory: packages/design_system
        run: very_good test

      - name: Install navigation dependencies
        working-directory: packages/navigation
        run: flutter pub get

      - name: Analyze navigation
        working-directory: packages/navigation
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Test navigation
        working-directory: packages/navigation
        run: very_good test
