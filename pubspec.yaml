name: project_tweety
description: "A playground app to try out ideas that we aren't implementing at work or I would like to implement at work."
publish_to: 'none'

version: 0.0.1

environment:
  sdk: ">=3.11.5 <4.0.0"
  flutter: ">=3.41.7"

dependencies:
  design_system:
    path: packages/design_system
  navigation:
    path: packages/navigation
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^9.0.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.0
  flutter_bloc: ^9.0.0
  flutter_inappwebview: ^6.1.5
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  go_router: ^17.2.3
  http: ^1.0.0
  injectable: ^2.7.1
  intl: ^0.20.2
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1

dev_dependencies:
  build_runner: ^2.10.5
  bloc_test: ^10.0.0
  bloc_lint: 0.3.7
  injectable_generator: ^2.9.0
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  freezed: ^3.2.3
  shared_preferences_platform_interface: ^2.4.2
  sqflite_common_ffi: ^2.4.0+3
  test: any
#  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

