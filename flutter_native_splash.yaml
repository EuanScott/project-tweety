# Splash screen: the neutral water scene in a circle on its sky colour. One
# splash for every theme colour (ADR-0017). Sources in assets/brand/.
# Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F4EEE7"
  color_dark: "#2A2521"
  image: assets/brand/splash_day.png
  image_dark: assets/brand/splash_night.png

  android_12:
    image: assets/brand/splash_android12_day.png
    image_dark: assets/brand/splash_android12_night.png
    color: "#F4EEE7"
    color_dark: "#2A2521"

  android: true
  ios: true
  web: false
