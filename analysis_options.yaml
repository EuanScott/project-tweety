# very_good_analysis supersedes flutter_lints: it is a verified superset of
# package:lints/recommended.yaml and all ten of flutter_lints' Flutter rules,
# and additionally enables strict-casts, strict-inference and strict-raw-types.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    # very_good_analysis pins close_sinks to `ignore`. Enabling the lint rule
    # alone is not enough — this errors: entry wins, so both are required.
    close_sinks: info
    # Deprecated in Dart 3.13 but still enabled by very_good_analysis 10.3.0.
    # Suppressed here rather than under linter: — naming a deprecated rule there
    # triggers deprecated_lint even when set to false.
    avoid_private_typedef_functions: ignore
    one_member_abstracts: ignore
    unnecessary_await_in_return: ignore

  exclude:
    # Re-declared deliberately: the including file's exclude overrides the
    # included one, and very_good_analysis' list covers neither tool/templates
    # nor the platform directories.
    - tool/templates/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated files are deliberately NOT excluded: they already carry
    # `// ignore_for_file: type=lint`, and exclude: would also hide genuine
    # compile errors in generated output.

linter:
  rules:
    # --- re-add what very_good_analysis omits ---
    close_sinks: true
    use_decorated_box: true

    # --- suppressed: style noise, not correctness ---
    lines_longer_than_80_chars: false                  # dart_style already enforces width
    public_member_api_docs: false                      # no external consumers
    avoid_types_on_closure_parameters: false           # fights strict-inference
    directives_ordering: false                         # churn, finds no bugs
    always_use_package_imports: false
    avoid_redundant_argument_values: false
    flutter_style_todos: false
    avoid_catches_without_on_clauses: false            # layered error mapping
    always_put_required_named_parameters_first: false


# Check bloc linting rules here: https://bloclibrary.dev/lint/
# Note: bloc_lint does not run under `flutter analyze`. It runs via the IDE or
# `bloc lint` from bloc_tools.
bloc:
  rules:
    avoid_build_context_extensions: false
    avoid_flutter_imports: error
    avoid_public_bloc_methods: error
    avoid_public_fields: warning
    prefer_build_context_extensions: false
    prefer_file_naming_conventions: false
    prefer_void_public_cubit_methods: info
    # prefer_bloc / prefer_cubit deliberately omitted: mutually exclusive by
    # design, and this repo uses both patterns.
