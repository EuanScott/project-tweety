name: design_system_gallery
description: >
  Component gallery for the design_system package — renders every adaptive
  widget in simultaneous Material and Cupertino comparison panes.
publish_to: 'none'

version: 0.0.1

environment:
  sdk: ^3.13.0

dependencies:
  # Not used directly in lib/ — provides the font asset design_system's
  # CupertinoListTileChevron needs (reachable via the design_system.dart
  # barrel export, so its icon glyph is tree-shaken in without this).
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.0.0
  design_system:
    path: ../
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
